<header class="topbar" *ngIf="mostraNavbar">
  <a routerLink="/" class="logo-link">
    <img src="assets/logo-villaserena.png" alt="Villa Serena" class="logo-img">
  </a>

  <nav [class.aperto]="menuAperto">
    <a routerLink="/" routerLinkActive="attivo" [routerLinkActiveOptions]="{exact: true}">Home</a>
    <a routerLink="/catalogo" routerLinkActive="attivo">Catalogo</a>
    <a routerLink="/eventi" routerLinkActive="attivo">Eventi</a>
    <a routerLink="/gestione-opere" routerLinkActive="attivo" *ngIf="ruolo === 'OPERATORE' || ruolo === 'HR'">Gestione opere</a>
    <a routerLink="/gestione-eventi" routerLinkActive="attivo" *ngIf="ruolo === 'OPERATORE' || ruolo === 'HR'">Gestione eventi</a>
    <a routerLink="/area-personale" routerLinkActive="attivo" *ngIf="ruolo === 'OPERATORE' || ruolo === 'HR'"> Area personale</a>
    <a routerLink="/le-mie-prenotazioni" routerLinkActive="attivo" *ngIf="auth.isAuthenticated()">Le mie prenotazioni</a>
    <a routerLink="/feedback" routerLinkActive="attivo" *ngIf="auth.isAuthenticated()">Feedback</a>
    <a routerLink="/dashboard" routerLinkActive="attivo" *ngIf="ruolo === 'OPERATORE'">Dashboard</a>
  </nav>

  <div class="account">
    <app-notifiche-dropdown *ngIf="auth.isAuthenticated()"></app-notifiche-dropdown>

    <a routerLink="/admin" routerLinkActive="attivo" *ngIf="ruolo === 'HR'">
      <i class="fa-solid fa-user-shield"></i> Pannello HR
    </a>
    <a routerLink="/login" *ngIf="!auth.isAuthenticated()">Accedi</a>
    <button *ngIf="auth.isAuthenticated()" (click)="logout()">Esci</button>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>
